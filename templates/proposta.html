<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Palm Traveling · Criar Proposta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .btn-wa { transition: all 0.2s ease; }
        .btn-wa:hover { background-color: #075e54 !important; transform: scale(1.02); }
        .hero-gradient {
            background: linear-gradient(135deg, #F9F6F0 0%, #E9F0EC 100%);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header igual ao index.html -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='logo.png') }}" class="h-10 w-10 object-contain" alt="Blue Palm">
                <span class="text-xl font-bold text-gray-800 hidden sm:inline">Blue Palm</span>
            </div>
            <div class="flex gap-4 items-center">
                <a href="/" class="text-gray-600 hover:text-orange-600 transition text-sm font-medium">← Voltar ao site</a>
            </div>
        </div>
    </header>

    <!-- Hero pequeno -->
    <section class="hero-gradient py-12 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">✈️ Criar Proposta de Viagem</h1>
            <p class="text-gray-600 mt-2">Preencha os detalhes abaixo. O PDF será gerado automaticamente.</p>
        </div>
    </section>

    <!-- Formulário -->
    <div class="max-w-4xl mx-auto py-10 px-4">
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="bg-gradient-to-r from-[#0F2A4A] to-[#1d4e6e] px-6 py-4 flex items-center gap-3">
                <img src="{{ url_for('static', filename='logo.png') }}" class="h-10 w-auto bg-white rounded-full p-1" alt="Blue Palm">
                <span class="text-xl font-bold text-white">Blue Palm Traveling</span>
            </div>
            <div class="p-6">
                <form action="/gerar_pdf" method="POST" target="_blank">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <div>
                            <label class="block font-semibold text-gray-700">Nome do Cliente *</label>
                            <input type="text" name="cliente" required class="w-full border border-gray-300 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700">Email *</label>
                            <input type="email" name="email" required class="w-full border border-gray-300 rounded-xl p-2.5 focus:ring-2 focus:ring-orange-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
                        <div>
                            <label class="block font-semibold text-gray-700">Data Ida *</label>
                            <input type="date" name="data_ida" required class="w-full border border-gray-300 rounded-xl p-2.5">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700">Data Volta *</label>
                            <input type="date" name="data_volta" required class="w-full border border-gray-300 rounded-xl p-2.5">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700">👥 Nº de pessoas</label>
                            <input type="number" name="num_pessoas" value="1" min="1" class="w-full border border-gray-300 rounded-xl p-2.5">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <div>
                            <label class="block font-semibold text-gray-700">💰 Valor total da proposta (€) *</label>
                            <input type="number" step="0.01" name="valor_total" required class="w-full border border-gray-300 rounded-xl p-2.5 bg-orange-50 font-bold text-orange-600" placeholder="Ex: 2490.00">
                            <p class="text-xs text-gray-400 mt-1">Preço total para o número de pessoas indicado.</p>
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700">🍽️ Regime Alimentar</label>
                            <select name="regime" class="w-full border border-gray-300 rounded-xl p-2.5">
                                <option>Somente pequeno-almoço</option>
                                <option>Meia pensão</option>
                                <option>Pensão completa</option>
                                <option selected>All Inclusive</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="block font-semibold text-gray-700">✈️ Voo (companhia, nº, horários)</label>
                        <textarea name="voo" rows="2" class="w-full border border-gray-300 rounded-xl p-2.5" placeholder="Ex: TAP TP123, Lisboa -> Maldivas, 10h00"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <div>
                            <label class="block font-semibold text-gray-700">🏨 Nome do Hotel</label>
                            <input type="text" name="hotel" class="w-full border border-gray-300 rounded-xl p-2.5" placeholder="Ex: Conrad Maldives">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700">🚗 Transfer</label>
                            <input type="text" name="transfer" class="w-full border border-gray-300 rounded-xl p-2.5" placeholder="Ex: Privado ida/volta">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="block font-semibold text-gray-700">🛡️ Seguro de Viagem (seguradora e coberturas)</label>
                        <textarea name="seguro" rows="2" class="w-full border border-gray-300 rounded-xl p-2.5" placeholder="Ex: Seguro Mundo, cobertura médica 100k€, cancelamento..."></textarea>
                    </div>

                    <div class="mb-6">
                        <label class="block font-semibold text-gray-700">🏝️ Excursões / Actividades</label>
                        <textarea name="excursões" rows="3" class="w-full border border-gray-300 rounded-xl p-2.5" placeholder="Snorkeling, tour cultural, safari..."></textarea>
                    </div>

                    <button type="submit" class="btn-wa w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        📄 Exportar Proposta em PDF
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer simples -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">
            <p>© 2026 Blue Palm Traveling · Viagens sem complicações</p>
        </div>
    </footer>
</body>
</html>
